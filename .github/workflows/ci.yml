name: Validar pesquisa
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      # Os geradores dependem dessas fontes, além do pacote Pillow.
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m compileall -q scripts
      - run: python scripts/calculos.py
      - run: python scripts/gerar_resultados.py
      - run: python scripts/gerar_contexto.py
